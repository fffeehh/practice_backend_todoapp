services:
 todoapp-postgres:
  image: postgres:18.1-bookworm
  container_name: todoapp-env-postgres
  user: "${CURRENT_UID}:${CURRENT_GID}"
  environment:
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
    - PGDATA=/var/lib/postgresql/data/pgdata  
  volumes:
    - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql/data
  restart: always

 todoapp-postgres-migrate:
  image: migrate/migrate:v4.19.1
  user: "${CURRENT_UID}:${CURRENT_GID}"
  volumes:
    - ${PROJECT_ROOT}/migrations:/migrations

 port-forwarder:
  image: alpine/socat:1.8.0.3
  container_name: todoapp-postgres-port-forwarder
  command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
  ports:
    - "127.0.0.1:5432:5432"
